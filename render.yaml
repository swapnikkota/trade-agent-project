services:
  # Agent backend — FastAPI, deepagents, Groq, Postgres-backed thread
  # history, talks to the trades-mcp service (from the trades-api repo).
  - type: web
    runtime: python
    name: trade-agent-backend
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # LLM gateway (see the trade-agent-gateway service below). Set both
      # to route model calls through it; leave LLM_GATEWAY_URL unset to call
      # Groq directly (instant rollback, no redeploy of code needed).
      - key: LLM_GATEWAY_URL
        sync: false
      - key: LLM_GATEWAY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRADE_MCP_TRANSPORT
        value: http
      # The deployed trades-mcp service's streamable_http endpoint, e.g.
      # https://trades-mcp-xxxx.onrender.com/mcp (no trailing /sse — that
      # suffix is what tells registry.py to use the SSE transport instead).
      - key: TRADE_MCP_URL
        sync: false
      # Full Neon connection string. This is the SAME value as trades-api's
      # DATABASE_URL (one Neon database — "neondb" by default — shared via
      # separate schemas, not two separate databases). Schema separation
      # happens via POSTGRES_SCHEMA below, not a different connection.
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      # This app's schema within the shared database (thread/message
      # history) — separate from trades-api's "tradesdb" schema. Must
      # already exist (create it once via Neon's SQL editor:
      # CREATE SCHEMA IF NOT EXISTS trade_agent;) — this app creates its
      # tables inside it on startup but won't create the schema itself.
      - key: POSTGRES_SCHEMA
        value: trade_agent
      # Shared-secret API key (Phase 6). Leave unset to keep auth off. With
      # edge auth this is a secret only the gateway knows (REPLACE_ME_BACKEND_KEY
      # in its config), and CORS_ORIGINS below is set empty (the gateway does CORS).
      # Without edge auth, match it in the frontend's VITE_API_KEY.
      - key: API_KEY
        sync: false
      # The deployed frontend's Render URL, once known (Static Sites don't
      # get a stable URL until the first deploy, so this is a two-step
      # deploy: get the frontend's URL, then come back and set this).
      - key: CORS_ORIGINS
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      # US region project (keys are region-specific; EU is https://cloud.langfuse.com).
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com

  # LLM gateway — agentgateway proxying Groq. Holds the real Groq key and
  # requires its own API key from callers. Config lives in a Render Secret
  # File (see gateway/config.example.yaml), not in git.
  - type: web
    runtime: docker
    name: trade-agent-gateway
    rootDir: gateway
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # Only needed for the optional Gemini route (GEMINI_VIA_GATEWAY=true on
      # the backend); see gateway/config.example.yaml.
      - key: GEMINI_API_KEY
        sync: false
      # Render routes traffic to $PORT; the gateway config listens on 3000.
      - key: PORT
        value: "3000"

  # Frontend — React/Vite, built as a static bundle and served from
  # Render's CDN. Always free; doesn't share the 750 free-instance-hours
  # pool the two web services above do.
  - type: web
    runtime: static
    name: trade-agent-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # With edge auth: the GATEWAY's Render URL (no trailing slash), not the
      # backend's. Without it: the backend's URL.
      - key: VITE_API_BASE_URL
        sync: false
      # With edge auth: must match REPLACE_ME_BROWSER_KEY in the gateway config.
      # Without it: must match the backend's API_KEY exactly. A 401 on every
      # request means a mismatch. Note this value is public in the JS bundle.
      - key: VITE_API_KEY
        sync: false
